[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-spatial"
version = "0.1.0.dev0"
description = "GPU-accelerated spatial operations for Apple silicon, built on MLX: haversine distances, point-in-polygon, and grid-indexed spatial joins"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bojan Tunguz" }]
keywords = ["mlx", "gis", "spatial", "geospatial", "metal", "apple-silicon", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mlx>=0.30",
    "numpy>=1.24",
    "shapely>=2.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pandas>=2.0"]
test = ["pytest>=7", "pandas>=2.0", "scikit-learn>=1.3", "geopandas>=0.14"]
bench = ["pandas>=2.0", "geopandas>=0.14", "duckdb>=1.0", "pyarrow>=14", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/tunguz/mlx-spatial"

[tool.setuptools.packages.find]
include = ["mlx_spatial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
