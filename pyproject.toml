[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-geospatial"
version = "0.1.0.dev0"
description = "GPU-accelerated spatial operations for Apple silicon, built on MLX: haversine distances, point-in-polygon, and grid-indexed spatial joins"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bojan Tunguz" }]
keywords = ["mlx", "gis", "spatial", "geospatial", "metal", "apple-silicon", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "mlx>=0.30",
    "numpy>=1.24",
    "shapely>=2.0",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pandas>=2.0"]
test = ["pytest>=7", "pandas>=2.0", "scikit-learn>=1.3", "geopandas>=0.14", "ruff>=0.5"]
bench = ["pandas>=2.0", "geopandas>=0.14", "duckdb>=1.0", "pyarrow>=14", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/tabulai/mlx-geospatial"

[tool.setuptools.packages.find]
include = ["mlx_geospatial*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set so lint is reproducible across ruff versions (newer ruff
# releases enable more rules by default): pyflakes plus the pycodestyle
# errors, which is what the code base is kept clean against.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
