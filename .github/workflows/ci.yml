name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15  # Apple silicon; MLX requires arm64
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with latest MLX
        if: matrix.python-version != '3.13'
        run: python -m pip install -e ".[test]"
      - name: Install with minimum supported MLX
        if: matrix.python-version == '3.13'
        run: python -m pip install -e ".[test]" "mlx==0.32.0"
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check .
      - name: Test
        env:
          MTL_DEBUG_LAYER: "1"
          METAL_DEVICE_WRAPPER_TYPE: "1"
        run: python -m pytest -q

  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Smoke test installed wheel
        working-directory: ${{ runner.temp }}
        run: python -c "import mlx_geospatial; print(mlx_geospatial.__version__)"
