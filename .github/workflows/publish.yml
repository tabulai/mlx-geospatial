name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build tools
        run: python -m pip install build "twine>=7"
      - name: Read package version and validate release tag
        id: package-version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          if [[ "${GITHUB_EVENT_NAME}" == "release" && "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "::error::Release tag '${RELEASE_TAG}' must equal 'v${version}'"
            exit 1
          fi
      - name: Build distributions
        run: python -m build
      - name: Verify distribution set
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)

          if (( ${#wheels[@]} != 1 || ${#sdists[@]} != 1 )); then
            echo "::error::Expected exactly one wheel and one source distribution"
            printf 'Found: %s\n' dist/*
            exit 1
          fi

          python -m twine check --strict "${wheels[@]}" "${sdists[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  test-wheel:
    name: Test built wheel
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Install wheel and test dependencies
        run: >-
          python -m pip install
          dist/*.whl
          "pytest>=7"
          "pandas>=2.0"
          "scikit-learn>=1.3"
          "geopandas>=0.14"
      - name: Check dependencies
        run: python -m pip check
      - name: Prepare isolated wheel test tree
        run: |
          test_root="${RUNNER_TEMP}/wheel-test"
          mkdir -p "${test_root}"
          cp -R tests "${test_root}/tests"
          cp pyproject.toml "${test_root}/pyproject.toml"
      - name: Verify installed package origin and version
        working-directory: ${{ runner.temp }}/wheel-test
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          PYTHONPATH: ""
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path

          import mlx_geospatial

          module_path = Path(mlx_geospatial.__file__).resolve()
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          expected = os.environ["EXPECTED_VERSION"]

          assert not module_path.is_relative_to(workspace), (
              f"Imported checkout instead of installed wheel: {module_path}"
          )
          assert mlx_geospatial.__version__ == expected
          assert version("mlx-geospatial") == expected
          print(f"Testing {expected} from {module_path}")
          PY
      - name: Test installed wheel
        working-directory: ${{ runner.temp }}/wheel-test
        env:
          PYTHONPATH: ""
          MTL_DEBUG_LAYER: "1"
          METAL_DEVICE_WRAPPER_TYPE: "1"
        run: python -m pytest -q tests

  publish:
    name: Publish distributions
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: [build, test-wheel]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mlx-geospatial
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
